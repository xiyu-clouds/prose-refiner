
<style>
.box3d .cube-container {
  width: 200px;
  height: 200px;
  perspective: 800px;
  margin: 50px auto;
  transition: 0.8s ease-out;
}

.box3d .cube-container:hover {
  transform: scale(2);
}

.box3d .cube {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  animation: rotate 8s infinite linear;
}

.box3d .face {
  --french: linear-gradient(
      to right,
      #0000ff,
      #ffffff,
      #ffffff,
      #ffffff,
      #ff0000
    )
    1;
  position: absolute;
  width: 200px;
  height: 200px;
  color: white;
  font-size: 14px;
  text-align: center;
  line-height: 200px;
  background: rgba(0, 0, 0, 0.8);
  border: 2px solid;
  border-image: var(--french);
}

.box3d .front {
  transform: translateZ(100px);
}

.box3d .back {
  transform: rotateY(180deg) translateZ(100px);
}

.box3d .right {
  transform: rotateY(90deg) translateZ(100px);
}

.box3d .left {
  transform: rotateY(-90deg) translateZ(100px);
}

.box3d .top {
  transform: rotateX(90deg) translateZ(100px);
}

.box3d .bottom {
  transform: rotateX(-90deg) translateZ(100px);
}

@keyframes rotate {
  0% {
    transform: rotateX(0) rotateY(0) rotateZ(0);
  }

  100% {
    transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
  }
}

.box3d .cube .face {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1.3;
  padding: 4px;
  box-sizing: border-box;
}
</style>

<div style="
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  margin: 0;
  padding: 0;
  overflow: hidden;
" class="box3d">
  <div class="cube-container">
  <div class="cube">
    <div class="face front">一念既起<br>万相随生</div>
    <div class="face back">静水藏渊<br>微澜示警</div>
    <div class="face right">观海不溺<br>入海不迷</div>
    <div class="face left">见深即深<br>遇浅成浅</div>
    <div class="face top">身在樊笼<br>心游太虚</div>
    <div class="face bottom">潮来不拒<br>潮去不留</div>
  </div>
</div>
</div>
