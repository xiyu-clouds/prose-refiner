<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心海 · 琅嬛</title>
  <link rel="icon" href="/static/favicon.ico?v={{ app_version|default('1.4') }}" />
  <link rel="stylesheet" href="/static/css/all.min.css?v={{ app_version|default('1.4') }}"/>
  <link rel="stylesheet" href="/static/css/resources.css?v={{ app_version|default('1.4') }}">
</head>
<body>
    <div id="global-header" style="margin-bottom: 100px"></div>

    <div class="container" style="margin-top: 100px; margin-bottom: 100px">
      <div class="header">
        <h2>琅嬛 · 资源管理</h2>
      </div>

      <div class="main-layout">
        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">资源</div>
          <div class="sidebar-tabs">
            <div class="tab-item active" data-tab="files">文件树</div>
            <div class="tab-item" data-tab="images">图片库</div>
            <div class="tab-item" data-tab="audios">音频库</div>
          </div>
          <div class="sidebar-content">
            <div id="treePanel" class="tab-panel active" data-tab="files"></div>
            <div id="imagePanel" class="tab-panel" data-tab="images"></div>
            <div id="audioPanel" class="tab-panel" data-tab="audios"></div>
          </div>
        </div>

        <div class="content-panel">
          <div class="toolbar">
            <button class="Btn" id="toggleSidebar">
              <div class="sign">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#000" d="M3 7V5h18v2zm0 12v-2h18v2zm0-6v-2h18v2z"></path>
                </svg>
              </div>
              <div class="text">侧边栏</div>
            </button>
            <button class="Btn" id="editBtn" disabled>
              <div class="sign">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 20">
                    <path fill="#000" d="M7 7.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM7 13.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m-1-11a.5.5 0 0 1 1 0V3h2.5v-.5a.5.5 0 0 1 1 0V3H13v-.5a.5.5 0 0 1 1 0V3h.5A1.5 1.5 0 0 1 16 4.5v4.732c-.326.14-.632.342-.898.609L15 9.943V4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v12a.5.5 0 0 0 .5.5h3.72l-.163.653q-.044.176-.054.347H5.5A1.5 1.5 0 0 1 4 16.5v-12A1.5 1.5 0 0 1 5.5 3H6zm9.81 8.048l-4.83 4.83a2.2 2.2 0 0 0-.578 1.02l-.375 1.498a.89.89 0 0 0 1.079 1.078l1.498-.374a2.2 2.2 0 0 0 1.02-.578l4.83-4.83a1.87 1.87 0 0 0-2.645-2.644"></path>
                </svg>
              </div>
              <div class="text">编辑</div>
            </button>
            <button class="Btn" id="saveBtn" disabled>
              <div class="sign">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 20">
                    <path fill="#000" d="M3 5a2 2 0 0 1 2-2h8.379a2 2 0 0 1 1.414.586l1.621 1.621A2 2 0 0 1 17 6.621V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1v-4.5A1.5 1.5 0 0 1 6.5 10h7a1.5 1.5 0 0 1 1.5 1.5V16a1 1 0 0 0 1-1V6.621a1 1 0 0 0-.293-.707l-1.621-1.621A1 1 0 0 0 13.379 4H13v2.5A1.5 1.5 0 0 1 11.5 8h-4A1.5 1.5 0 0 1 6 6.5V4zm2 0v2.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5V4zm7 12v-4.5a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5V16z"></path>
                </svg>
              </div>
              <div class="text">保存</div>
            </button>
            <button class="Btn" id="uploadImageBtn" style="display:none;">
              <div class="sign">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#000" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline fill="none" stroke="#000" stroke-width="2" points="17 8 12 3 7 8"></polyline>
                    <line fill="none" stroke="#000" stroke-width="2" x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </div>
              <div class="text">上传图片</div>
            </button>
            <button class="Btn" id="uploadAudioBtn" style="display:none;">
              <div class="sign">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#000" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3z"></path>
                </svg>
              </div>
              <div class="text">上传音频</div>
            </button>
            <button class="Btn" id="uploadLyricBtn" style="display:none;">
              <div class="sign">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#000" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"></path>
                </svg>
              </div>
              <div class="text">上传歌词</div>
            </button>
          </div>

          <div class="content-area">
            <div id="fileView" class="view-panel active">
              <div class="placeholder">👈 选择左侧文件查看内容</div>
            </div>
            <div id="imageView" class="view-panel">
              <div class="upload-zone" id="imageUploadZone">
                <div class="upload-title">图片上传</div>
                <div class="upload-text">拖拽图片到此处或点击上传</div>
                <input type="file" id="imageFileInput" accept="image/*" multiple hidden>
              </div>
              <div class="grid-container" id="imageGrid"></div>
            </div>
            <div id="audioView" class="view-panel">
              <div class="upload-section">
                <div class="upload-zone" id="audioUploadZone">
                  <div class="upload-title">音频上传</div>
                  <div class="upload-text">拖拽音频文件到此处或点击上传</div>
                  <div class="upload-hint">提示：请先上传音频文件，再上传歌词文件</div>
                  <input type="file" id="audioFileInput" accept="audio/*" multiple hidden>
                </div>
                <div class="upload-zone" id="lyricUploadZone">
                  <div class="upload-title">歌词上传</div>
                  <div class="upload-text">拖拽歌词文件(.lrc)到此处或点击上传</div>
                  <div class="upload-hint">提示：歌词文件名必须与音频文件名一致（不含扩展名），才能自动关联到对应歌曲</div>
                  <input type="file" id="lyricFileInput" accept=".lrc" multiple hidden>
                </div>
              </div>
              <div class="list-container" id="audioList"></div>
            </div>
          </div>
        </div>
      </div>

        <div id="left-bottom-panel" style="position: fixed; bottom: 12px; left: 12px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-start;">
          <div id="task-notifications" style="display: flex; flex-direction: column-reverse; gap: 4px; width: 100%; margin-bottom: 30px; max-width: 200px;"></div>
          <div id="minimized-hints"></div>
        </div>
    </div>

    <div id="imagePreviewModal" class="preview-modal">
      <div class="preview-overlay" id="previewOverlay"></div>
      <div class="preview-content">
        <button class="preview-close" id="previewClose">✕</button>
        <img id="previewImage" src="" alt="">
      </div>
    </div>

    <div id="audioEditModal" class="edit-modal">
      <div class="edit-overlay" id="editOverlay"></div>
      <div class="edit-content">
        <div class="edit-header">
          <h3>编辑音频信息</h3>
          <button class="edit-close" id="editClose">✕</button>
        </div>
        <div class="edit-form">
          <div class="form-group">
            <label>歌名</label>
            <input type="text" id="editTitle" readonly>
          </div>
          <div class="form-group">
            <label>艺术家</label>
            <input type="text" id="editArtist">
          </div>
        </div>
        <div class="edit-actions">
          <button class="modal-btn" id="saveAudioBtn">保存</button>
          <button class="modal-btn cancel" id="cancelAudioBtn">取消</button>
        </div>
      </div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div id="global-footer" style="margin-top: 80px"></div>

    <script src="/static/js/utils/utils.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/header.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/footer.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/contextMenu.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/scrollButtons.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/animations/bikeAnimation.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/taskNotifications.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/terminal.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/pages/resources.js?v={{ app_version|default('1.4') }}" defer></script>
</body>
</html>
