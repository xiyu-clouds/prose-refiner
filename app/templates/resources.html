<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心海 · 资源查看</title>
  <link rel="icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/css/all.min.css"/>
  <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #f9f9f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", sans-serif;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        position: relative; /* 为绝对定位按钮提供参考 */
      }

    .container {
      width: 100%;
      margin: 0 auto;
      position: relative;
      padding: 0 16px;
    }

    .header {
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      border-radius: 8px;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    .main-layout {
      display: flex;
      position: relative; /* 为 toggle-btn 提供定位上下文 */
      gap: 16px; /* 侧边栏和内容区间距 */
    }

    /* 工具栏本体 */
    .toolbar {
      padding: 12px 16px;           /* 适当内边距 */
      background: transparent;      /* 透明背景，融入页面 */
      border-bottom: 1px solid #eee; /* 极细分割线，可选 */
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .Btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: 0.4s;
      box-shadow: 1px 1px 6px rgba(0, 0, 0, 0.15); /* 稍微弱化阴影 */
      background: linear-gradient(to right, #3498db, #e74c3c);
      margin: 0 6px;
    }

    .sign {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;   /* 图标绝对居中！不加 padding */
      transition-duration: 0.4s;
    }

    .sign svg {
      width: 16px;
      height: 16px;
    }

    .sign svg path {
      fill: white;
    }

    .text {
      position: absolute;
      right: 0;
      width: 0;
      opacity: 0;
      color: #ecf0f1;
      font-size: 1em;
      font-weight: 600;
      transition-duration: 0.4s;
      white-space: nowrap;
    }

    .Btn:hover {
      width: 120px;              /* 缩短展开宽度 */
      border-radius: 18px;       /* 匹配 40px 高度 */
      background: linear-gradient(to right, #3498db, #e74c3c);
    }

    .Btn:hover .sign {
      width: 32px;               /* 固定图标区宽度，避免抖动 */
      height: 100%;
    }

    .Btn:hover .text {
      opacity: 1;
      width: calc(100% - 32px);
      padding-left: 8px;         /* 文字内边距，不破坏居中 */
      display: flex;
      align-items: center;
    }

    .Btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0.15);
    }

    /* === 侧边栏容器 === */
    .sidebar {
      width: 280px;
      background: #fafafa;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
      transition: width 0.3s ease, opacity 0.3s ease;
    }

    .sidebar.collapsed {
      width: 0 !important;
      padding: 0;
      border: none;
    }

    /* === 树根容器：必须 block + 禁止 flex 压缩 === */
    #treeContainer {
      display: block;
      min-width: 100%;
    }

    /* === 每个节点：flex 横向排图标+文字，但整体垂直堆叠 === */
    .tree-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      cursor: pointer;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      min-width: 0;
    }

    .tree-children {
      padding-left: 24px;
    }
    .tree-node:hover {
      background-color: #f0f4ff;
    }
    .tree-node.active {
      border-left-color: #4a00e0;
      background-color: #e6eeff;
    }

    .toggle-icon,
    .node-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .node-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1; /* 关键：让文件名占满剩余空间 */
    }

    /* 内容区 */
    .content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      background: white;
    }

    .file-view {
      flex: 1;
      display: flex;
      flex-direction: column; /* 确保子元素纵向排列 */
      padding: 0; /* 如果需要，可保留或调整 */
    }

    .file-body {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .file-body iframe {
      border: 1px solid #eee;
      border-radius: 4px;
    }

    /* 文件标题：更大、加粗、有呼吸感 */
    .file-title {
      font-size: 20px;
      font-weight: 700; /* 加粗 */
      margin-bottom: 12px;
      color: #333;
    }

    /* 元信息容器 */
    .file-meta {
      font-size: 14px; /* 从 12px → 14px */
      color: #666;     /* 从 #999 → #666，更清晰 */
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .file-meta p {
      margin: 4px 0; /* 微调间距 */
    }

    .file-meta strong {
      font-weight: 600;
      color: #444;
      min-width: 40px;
      display: inline-block;
    }

    .code-block {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, monospace;
      font-size: 14px;
      word-wrap: break-word;
    }

    .placeholder {
      color: #888;
      text-align: center;
    }

    /* 关闭按钮样式 */
    .close-btn {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      width: 28px;
      height: 28px;
      border: none;
      background: #f1f1f1;
      color: #999;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all 0.2s;
    }
    .close-btn:hover {
      background: #e0e0e0;
      color: #333;
    }

      /* 左下角弹窗内容展示区域 */
      #minimized-hints {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 10000;
        display: flex;
        flex-direction: column-reverse; /* 新项在视觉上方（靠近底部） */
        gap: 4px;
        max-width: 200px;
      }

      .minimized-hint-item {
        background: rgba(30, 30, 30, 0.85); /* 深灰半透，比 modal 背景稍浅 */
        color: #e0e0e0;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        transition: background-color 0.2s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        max-width: 100%;
      }

      .minimized-hint-item:hover {
        background: rgba(50, 50, 50, 0.95);
        color: #fff;
      }
  </style>
</head>
<body>
    <div id="global-header" style="margin-bottom: 100px"></div>

    <div class="container" style="margin-top: 100px; margin-bottom: 100px">
      <div class="header">
        <h2>心海 · 资源查看</h2>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
          <button class="Btn" id="toggleSidebar">
            <div class="sign">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                  <path fill="#000" d="M3 7V5h18v2zm0 12v-2h18v2zm0-6v-2h18v2z"></path>
              </svg>
            </div>
            <div class="text">侧边栏</div>
          </button>
          <!-- 编辑 -->
          <button class="Btn" id="editBtn" disabled>
            <div class="sign">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 20">
                  <path fill="#000" d="M7 7.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM7 13.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m-1-11a.5.5 0 0 1 1 0V3h2.5v-.5a.5.5 0 0 1 1 0V3H13v-.5a.5.5 0 0 1 1 0V3h.5A1.5 1.5 0 0 1 16 4.5v4.732c-.326.14-.632.342-.898.609L15 9.943V4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v12a.5.5 0 0 0 .5.5h3.72l-.163.653q-.044.176-.054.347H5.5A1.5 1.5 0 0 1 4 16.5v-12A1.5 1.5 0 0 1 5.5 3H6zm9.81 8.048l-4.83 4.83a2.2 2.2 0 0 0-.578 1.02l-.375 1.498a.89.89 0 0 0 1.079 1.078l1.498-.374a2.2 2.2 0 0 0 1.02-.578l4.83-4.83a1.87 1.87 0 0 0-2.645-2.644"></path>
              </svg>
            </div>
            <div class="text">编辑</div>
          </button>
          <!-- 保存 -->
          <button class="Btn" id="saveBtn" disabled>
            <div class="sign">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 20 20">
                  <path fill="#000" d="M3 5a2 2 0 0 1 2-2h8.379a2 2 0 0 1 1.414.586l1.621 1.621A2 2 0 0 1 17 6.621V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1v-4.5A1.5 1.5 0 0 1 6.5 10h7a1.5 1.5 0 0 1 1.5 1.5V16a1 1 0 0 0 1-1V6.621a1 1 0 0 0-.293-.707l-1.621-1.621A1 1 0 0 0 13.379 4H13v2.5A1.5 1.5 0 0 1 11.5 8h-4A1.5 1.5 0 0 1 6 6.5V4zm2 0v2.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5V4zm7 12v-4.5a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5V16z"></path>
              </svg>
            </div>
            <div class="text">保存</div>
          </button>
      </div>

      <div class="main-layout">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
          <div id="treeContainer"></div>
        </div>

        <!-- 内容区 -->
        <div class="content-panel">
          <div class="file-view" id="fileView">
            <div class="placeholder">👈 选择左侧文件查看内容</div>
          </div>
        </div>
      </div>

        <!-- 左下角统一容器 -->
        <div id="left-bottom-panel" style="position: fixed; bottom: 12px; left: 12px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-start; max-width: 200px;">

          <!-- 任务通知区（上方） -->
          <div id="task-notifications" style="display: flex; flex-direction: column-reverse; gap: 4px; width: 100%; margin-bottom: 30px;">
              <template x-for="notif in notifications" :key="notif.id">
                  <div class="minimized-hint-item" @click="handleNotificationClick(notif)">
                      <span x-text="`${notif.message}  ${notif.time}`"></span>
                  </div>
              </template>
          </div>

          <!-- 原有最小化弹窗区（下方） -->
          <div id="minimized-hints" style="display: flex; flex-direction: column-reverse; gap: 4px; width: 100%;"></div>
        </div>
    </div>

    <!-- 状态提示框 -->
    <div id="statusBox" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 10000; display: none;"></div>

    <div id="global-footer" style="margin-top: 50px"></div>

    <!-- 保留你的外部脚本 -->
    <script src="/static/js/header.js" defer></script>
    <script src="/static/js/footer.js" defer></script>
    <script src="/static/js/utils.js" defer></script>
    <script src="/static/js/contextMenu.js" defer></script>
    <script src="/static/js/scrollButtons.js" defer></script>
    <script src="/static/js/bikeAnimation.js" defer></script>
    <script src="/static/js/taskNotifications.js" defer></script>
    <script src="/static/js/resources.js" defer></script>
</body>
</html>
