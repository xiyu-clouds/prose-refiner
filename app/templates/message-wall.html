<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心海 · 流萤</title>
  <link rel="icon" href="/static/favicon.ico?v={{ app_version|default('1.4') }}" />
  <link rel="stylesheet" href="/static/css/all.min.css?v={{ app_version|default('1.4') }}"/>
  <link rel="stylesheet" href="/static/css/message-wall.css?v={{ app_version|default('1.4') }}">
</head>
<body>
  <div id="global-header" style="margin-bottom: 100px"></div>

  <div class="container" style="margin-top: 100px; margin-bottom: 100px">
    <div class="header">
      <h2>心海 · 流萤</h2>
    </div>

    <div id="message-wall-container" class="message-wall-container">
      <div id="barrage-layer" class="barrage-layer"></div>

      <div id="control-buttons" class="control-buttons">
        <div id="input-panel" class="input-panel">
          <input type="text" id="barrage-input" placeholder="输入留言..." />
          <button id="send-btn" class="control-btn" title="发送弹幕">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>

        <div class="divider"></div>

        <button id="toggle-btn" class="control-btn" title="弹幕开关">
          <i class="fas fa-eye"></i>
        </button>
        <button id="pause-btn" class="control-btn" title="暂停/继续">
          <i class="fas fa-pause"></i>
        </button>
        <button id="refresh-btn" class="control-btn" title="刷新弹幕">
          <i class="fas fa-sync-alt"></i>
        </button>

        <div class="divider"></div>

        <div class="slider-container">
          <span class="slider-label">弹幕数量</span>
          <input type="range" id="count-slider" min="1" max="30" value="10" step="1" />
          <span id="count-value" class="slider-value">10</span>
        </div>

        <div class="slider-container">
          <span class="slider-label">基础速度</span>
          <input type="range" id="speed-slider" min="1" max="80" value="40" step="1" />
          <span id="speed-value" class="slider-value">40</span>
        </div>
      </div>
    </div>

    <div class="quotes-section">
      <h3 class="quotes-title">
        <i class="fas fa-comments"></i>
        <span>留言记录</span>
        <span id="quotes-count" class="quotes-count">0</span>
      </h3>
      <div class="quotes-grid" id="quotesGrid"></div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div id="left-bottom-panel" style="position: fixed; bottom: 12px; left: 12px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-start;">
      <div id="task-notifications" style="display: flex; flex-direction: column-reverse; gap: 4px; width: 100%; margin-bottom: 30px; max-width: 200px;">
      </div>
      <div id="minimized-hints"></div>
    </div>
  </div>

  <div id="global-footer" style="margin-top: 80px"></div>

  <script src="/static/js/vendors/axios.min.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/utils.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/header.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/footer.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/contextMenu.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/scrollButtons.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/animations/shipAnimation.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/taskNotifications.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/utils/terminal.js?v={{ app_version|default('1.4') }}" defer></script>
  <script src="/static/js/pages/message-wall.js?v={{ app_version|default('1.4') }}" defer></script>
</body>
</html>
