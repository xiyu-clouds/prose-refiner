<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心海 · 淬文</title>
    <link rel="icon" href="/static/favicon.ico?v={{ app_version|default('1.4') }}" />
    <link rel="stylesheet" href="/static/css/all.min.css?v={{ app_version|default('1.4') }}"/>
    <link rel="stylesheet" href="/static/css/rule.css?v={{ app_version|default('1.4') }}">
</head>
<body>
    <div id="global-header" style="margin-bottom: 100px"></div>

    <div class="container" style="margin-top: 100px; margin-bottom: 100px">
        <div class="header">
            <h2>淬文 · 规则配置</h2>
        </div>

        <div class="page-actions">
            <button id="loadBtn" class="btn btn-outline">📂 加载配置</button>
            <button id="saveBtn" class="btn btn-primary">💾 保存更改</button>
        </div>

        <!-- 标点规则卡片 -->
        <div class="plugin-card">
            <div class="plugin-header" onclick="toggleCard('punctuation-card')">
                <span>标点规则配置</span>
                <span class="icon">▼</span>
            </div>
            <div class="plugin-body" id="punctuation-card">
                <div class="form-group full-width">
                    <label title="半角字符转全角字符的映射表">半角转全角映射</label>
                    <div id="halfFullContainer"></div>
                    <button class="add-item-btn" onclick="addHalfFullRow()">添加映射</button>
                </div>

                <div class="form-group full-width">
                    <label title="检测连续或错误使用的标点符号">无效标点模式</label>
                    <div id="invalidPunctuationContainer"></div>
                    <button class="add-item-btn" onclick="addPatternItem('invalidPunctuationContainer')">添加模式</button>
                </div>

                <div class="form-group full-width">
                    <label title="检测中文与其他字符之间缺少空格的情况">缺少空格模式</label>
                    <div id="missingSpaceContainer"></div>
                    <button class="add-item-btn" onclick="addMissingSpaceItem()">添加模式</button>
                </div>

                <div class="form-group full-width">
                    <label title="检测标点使用错误并自动修正">错误标点模式</label>
                    <div id="wrongPunctuationContainer"></div>
                    <button class="add-item-btn" onclick="addWrongPunctuationItem()">添加模式</button>
                </div>
            </div>
        </div>

        <!-- 拼写规则卡片 -->
        <div class="plugin-card">
            <div class="plugin-header" onclick="toggleCard('spell-card')">
                <span>拼写规则配置</span>
                <span class="icon">▼</span>
            </div>
            <div class="plugin-body" id="spell-card">
                <div class="form-group full-width">
                    <label title="常见的词语使用错误，包括成语、固定搭配等">常见错误</label>
                    <div id="commonErrorsContainer"></div>
                    <button class="add-dict-btn" onclick="addDictEntry('commonErrorsContainer')">添加条目</button>
                </div>

                <div class="form-group full-width">
                    <label title="检测并修正的/地/得的错误使用">的/地/得修正</label>
                    <div id="deFixContainer"></div>
                    <button class="add-item-btn" onclick="addDeFixItem()">添加修正</button>
                </div>
            </div>
        </div>

        <!-- 状态提示 -->
        <div id="statusBox" class="status-box"></div>

        <!-- 左下角统一容器 -->
        <div id="left-bottom-panel" style="position: fixed; bottom: 12px; left: 12px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-start;">
            <!-- 任务通知区（上方） -->
            <div id="task-notifications" style="display: flex; flex-direction: column-reverse; gap: 4px; width: 100%; margin-bottom: 30px; max-width: 200px;"></div>
            <!-- 原有最小化弹窗区（下方） -->
            <div id="minimized-hints"></div>
        </div>
    </div>

    <div id="global-footer" style="margin-top: 80px"></div>

    <script src="/static/js/vendors/axios.min.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/utils.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/header.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/footer.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/contextMenu.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/scrollButtons.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/animations/airplaneAnimation.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/taskNotifications.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/utils/terminal.js?v={{ app_version|default('1.4') }}" defer></script>
    <script src="/static/js/pages/rule.js?v={{ app_version|default('1.4') }}" defer></script>
</body>
</html>
