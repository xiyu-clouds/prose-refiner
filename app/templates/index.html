    <script src="https://cdn.tailwindcss.com"></script>

        // 必须在 tailwind CDN 加载后立即执行，但放在此处是安全的
        // 实际上 CDN 脚本会检测已有的 tailwind.config 对象
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            corePlugins: {
                preflight: false  // 禁用重置，避免覆盖原有样式
            }
        };

          <p><span>观海不溺，入海不迷</span></p>

          <p><span>身在樊笼，心游太虚</span></p>
          <p><span>潮来不拒，潮去不留</span></p>

      <!-- 计时器区域（居中） -->

    <!-- 百位 -->

      <!-- ===== 心海 · 横幅 + 卡片网格 + 文章===== -->
      <div
        class="xh-section"
        style="
          width: 92%;
          max-width: 1280px;
          margin: 80px auto 60px;
          padding: 0;
          box-sizing: border-box;
        "
      >
        <!-- 横幅标题 -->
        <div
          class="xh-banner"
          style="text-align: center; margin-bottom: 40px; position: relative"
        >
          <h2
            style="
              font-size: 28px;
              font-weight: 700;
              color: #333;
              letter-spacing: 1px;
              display: inline-block;
              padding-bottom: 12px;
            "
          >
            心海 · 探索
          </h2>
          <div
            style="
              position: absolute;
              bottom: 0;
              left: 50%;
              transform: translateX(-50%);
              width: 60px;
              height: 3px;
              background: linear-gradient(to right, #f89b29, #ff0f7b);
              border-radius: 2px;
            "
          ></div>
        </div>

        <!-- 网格卡片 -->
        <div
          class="xh-cards-grid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 12px;
          "
        >
           <template x-for="card in $store.app.cards" :key="card.id">
                <div class="xh-interactive-card" :data-bg="card.bgUrl || ''" :style="card.bgStyle || ''">
                    <div class="xh-card-content">
                        <p class="xh-card-desc" x-text="card.desc"></p>
                    </div>
                </div>
            </template>
        </div>

        <!-- 左下角统一容器 -->
        <div id="left-bottom-panel" style="position: fixed; bottom: 12px; left: 12px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-start;">

          <!-- 任务通知区（上方） -->
          <div id="task-notifications" style="display: flex; flex-direction: column-reverse; gap: 4px; width: 100%; margin-bottom: 30px; max-width: 200px;">
          </div>

          <!-- 原有最小化弹窗区（下方） -->
          <div id="minimized-hints"></div>
        </div>

      </div>
    </div>

    <!-- 状态提示框 -->
    <div id="statusBox" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 10000; display: none;"></div>
