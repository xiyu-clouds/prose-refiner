
services:
  psytext:
    container_name: psytext_analyst
    build:
      context: .
      args:
        BUILDKIT_PROGRESS: plain
    image: psytext_analyst:latest
    # Docker stop 信号传递 & 优雅停机（实际行为支撑）：
    #   - stop_signal: SIGTERM 是 uvicorn 默认监听的终止信号
    #   - stop_grace_period 90s：给 timeout-graceful-shutdown(60s) + 后续
    #     lifespan shutdown / WAL checkpoint / 元认知关闭留足余量，避免
    #     docker 提前发 SIGKILL（发了 SIGKILL 则 shutdown 代码永远不执行）
    stop_signal: SIGTERM
    stop_grace_period: 90s
    init: true
    ports:
      - "8000:8000"
    volumes:
      - /opt/psytext/data:/data
      - pip_cache:/root/.cache/pip
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - DOCKER_BUILDKIT=1
      - XINHAI_STORAGE_BACKEND=redis
      - XINHAI_REDIS_HOST=redis

    depends_on:
      - redis

  redis:
    container_name: psytext_redis
    image: redis:7-alpine
    volumes:
      - psytext_redis_data:/data
    restart: unless-stopped

volumes:
  pip_cache:
  psytext_redis_data:
    name: psytext_redis_data